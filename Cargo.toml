[package]
name = "kilnonedre-foundation-rust"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "lib/common-config",
    "lib/common-db",
    "lib/common-grpc",
    "lib/common-misc",
    "lib/common-type",
    "lib/common-web",
    "lib/common-util",
    "lib/internal-clients",
    "lib/common-kafka",
    "lib/common-ws",
    "lib/common-macro",
    "lib/common-we-chat-pay",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
common-config = { path = "lib/common-config" }
common-db = { path = "lib/common-db" }
common-web = { path = "lib/common-web" }
common-type = { path = "lib/common-type" }
common-grpc = { path = "lib/common-grpc" }
common-misc = { path = "lib/common-misc" }
common-util = { path = "lib/common-util" }
common-kafka = { path = "lib/common-kafka" }
common-ws = { path = "lib/common-ws" }
common-macro = { path = "lib/common-macro" }
common-we-chat-pay = { path = "lib/common-we-chat-pay" }

internal-clients = { path = "lib/internal-clients" }

actix = "0.13.5"
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
log = "0.4"
env_logger = "0.11"

sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
] }


utoipa = { version = "5", features = ["decimal", "uuid", "chrono"] }
utoipa-actix-web = "0.1"
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"

dotenvy = "0.15.7"
sea-orm-migration = "1.1.16"
argon2 = "0.5.3"
once_cell = "1.21.3"
jsonwebtoken = { version = "10.0.0", features = ["aws_lc_rs"] }
tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"

base64 = "0.22.1"
blake3 = "1.8.2"
rand = "0.9.2"

aws-config = "1"
aws-sdk-s3 = "1"
aws-credential-types = "1"

sha2 = "0.10.9"
futures-util = "0.3.31"
hex = "0.4.3"
local-ip-address = "0.6.8"
regex = "1.12.2"

async-std = { version = "1", features = ["attributes", "tokio1"] }

rust_decimal = { version = "1.41.0", features = ["serde"] }

hmac = "0.12.1"
urlencoding = "2.1.3"
openssl = "0.10.78"

serde_qs = "1.1.1"
tokio-cron-scheduler = "0.15.1"
redis = { version = "1.2.1", features = ["aio", "tokio-comp"] }
rdkafka = { version = "0.39.0", features = ["tokio"] }
futures = "0.3.32"

actix-web-actors = "4.3.1"
dashmap = "6.1.0"
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = "2.0.118"

[dependencies]
