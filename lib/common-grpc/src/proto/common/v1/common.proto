syntax = "proto3";

package common.v1;

enum GrpcOperatorType {
  // 默认值
  GRPC_OPERATOR_TYPE_UNSPECIFIED = 0;
  // 管理员
  GRPC_OPERATOR_TYPE_ADMIN = 1;
  // 商户
  GRPC_OPERATOR_TYPE_SELLER = 2;
  // 用户
  GRPC_OPERATOR_TYPE_CONSUMER = 3;
}

message GrpcOperatorContext {
  // 操作人 ID
  string user_id = 1;
  // 租户 ID
  string merchant_id = 2;
  // 身份类型
  GrpcOperatorType type = 3;
}

enum GrpcApprovalStatus {
  // 默认值
  GRPC_APPROVAL_STATUS_UNSPECIFIED = 0;
  // 待审核
  GRPC_APPROVAL_STATUS_PENDING = 1;
  // 审核通过
  GRPC_APPROVAL_STATUS_APPROVED = 2;
  // 审核拒绝
  GRPC_APPROVAL_STATUS_REJECTED = 3;
  // 用户取消
  GRPC_APPROVAL_STATUS_CANCELLED = 4;
}
