syntax = "proto3";

package catalog.v1;

enum GrpcCatalogProcurementType {
  // 默认值
  GRPC_CATALOG_PROCUREMENT_TYPE_UNSPECIFIED = 0;

  // 供应商
  GRPC_CATALOG_PROCUREMENT_TYPE_SUPPLIER = 1;

  // 采购员
  GRPC_CATALOG_PROCUREMENT_TYPE_PURCHASER = 2;
}

enum GrpcCatalogStorageMethod {
  // 默认值
  GRPC_CATALOG_STORAGE_METHOD_UNSPECIFIED = 0;

  // 冷藏
  GRPC_CATALOG_STORAGE_METHOD_COLD = 1;

  // 冷冻
  GRPC_CATALOG_STORAGE_METHOD_FROZEN = 2;

  // 常温
  GRPC_CATALOG_STORAGE_METHOD_NORMAL = 3;
}
