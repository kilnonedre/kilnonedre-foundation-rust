syntax = "proto3";

package wms.v1;

service GrpcWmsWarehouseService {
  rpc Read(GrpcWmsWarehouseServiceReadRequest) returns (GrpcWmsWarehouseServiceReadResponse);

  rpc BatchRead(GrpcWmsWarehouseServiceBatchReadRequest) returns (GrpcWmsWarehouseServiceBatchReadResponse);
}

// 读取请求
message GrpcWmsWarehouseServiceReadRequest {
  string id = 1;
}

// 读取响应
message GrpcWmsWarehouseServiceReadResponse {
  GrpcWmsWarehouseServiceWarehouseResponse warehouse = 1;
}

// 批量读取请求
message GrpcWmsWarehouseServiceBatchReadRequest {
  // ID 列表
  repeated string ids = 1;
}

// 批量读取响应
message GrpcWmsWarehouseServiceBatchReadResponse {
  // 列表
  repeated GrpcWmsWarehouseServiceWarehouseResponse warehouses = 1;
}

// 仓库信息
message GrpcWmsWarehouseServiceWarehouseResponse {
  // ID
  string id = 1;

  // 名称
  string name = 2;

  // 编码
  optional string code = 3;

  // 是否启用
  bool is_enabled = 4;

  // 定位 ID
  string location_id = 5;

  // 详细地址
  optional string location_detail = 6;
}
